<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="description" content="A private, customizable GPA and college-planning dashboard.">
    <meta property="og:title" content="GPA Pro — Academic planning, made clear">
    <meta property="og:description" content="Calculate GPA, test future scenarios, and organize college planning.">
    <meta property="og:type" content="website">
    <title>GPA Pro — Academic planning, made clear</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/overrides.css">
    <script>
      (() => {
        const saved = localStorage.getItem('gpa-pro:theme');
        const dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to content</a>
    <div id="app"></div>
    <noscript>GPA Pro needs JavaScript enabled to calculate and save your academic plan.</noscript>
  </body>
</html>
